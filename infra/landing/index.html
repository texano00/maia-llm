<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Maia LLM — open-weight models on a GPU you rent by the minute</title>
    <meta
      name="description"
      content="Maia LLM runs open-weight language models on a GPU rented only for as long as you use it."
    />
    <link rel="icon" type="image/png" href="/logo.png" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #080b12;
        --panel: rgb(255 255 255 / 4%);
        --border: rgb(255 255 255 / 10%);
        --text: #e7ecf5;
        --muted: #8fa3c8;
        --accent: #4868ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem 1.25rem;
        background:
          radial-gradient(60rem 30rem at 50% -10%, rgb(72 104 255 / 18%), transparent 70%),
          var(--bg);
        color: var(--text);
        font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }

      main {
        width: 100%;
        max-width: 34rem;
        display: grid;
        justify-items: center;
        gap: 1.5rem;
        padding: 3rem 2.5rem;
        border: 1px solid var(--border);
        border-radius: 1.25rem;
        background: var(--panel);
        backdrop-filter: blur(12px);
        text-align: center;
      }

      .logo {
        width: 9rem;
        height: auto;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.9rem, 5vw, 2.6rem);
        letter-spacing: -0.03em;
        line-height: 1.1;
      }

      p.motto {
        margin: 0;
        max-width: 30ch;
        color: var(--muted);
        font-size: 1.05rem;
      }

      a.cta {
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
        margin-top: 0.5rem;
        padding: 0.75rem 1.25rem;
        border: 1px solid rgb(72 104 255 / 55%);
        border-radius: 0.7rem;
        background: rgb(72 104 255 / 22%);
        color: #fff;
        font-weight: 600;
        text-decoration: none;
      }

      a.cta:hover,
      a.cta:focus-visible {
        background: rgb(72 104 255 / 34%);
      }

      footer {
        color: #6f83a6;
        font-size: 0.8rem;
      }

      @media (prefers-color-scheme: light) {
        /* The logo is drawn for dark surfaces; keep the page dark either way. */
      }
    </style>
  </head>
  <body>
    <main>
      <img class="logo" src="/logo.png" alt="Maia LLM" width="560" height="568" />      <h1>Maia LLM</h1>
      <p class="motto">
        Run open-weight language models on a GPU you rent only for as long as you use it.
      </p>
      <a class="cta" href="https://github.com/texano00/maia-llm" rel="noreferrer">
        View on GitHub
      </a>
      <footer>Developed with ❤️ for an open future</footer>
    </main>
  </body>
</html>
