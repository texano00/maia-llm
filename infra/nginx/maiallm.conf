# maiallm.com on your own nginx.
#
#   /etc/nginx/conf.d/maiallm.conf
#
# The container is the only upstream: it serves the API (`/v1/...`), the
# backoffice bundle (`/admin`) and `/health` on 127.0.0.1:8787. nginx decides
# what each hostname is allowed to reach, so the API and the private backoffice
# never share a hostname.
#
#   maiallm.com      → static landing page  (/var/www/maiallm)
#   api.maiallm.com  → /v1/... and /health, /v1/admin/* answers 404
#   pvt.maiallm.com  → /admin (backoffice SPA) and /v1/admin/*
#
# Certificates: one Let's Encrypt cert with all four names keeps this file short.
#
#   sudo mkdir -p /var/www/certbot /var/www/maiallm
#   sudo certbot certonly --webroot -w /var/www/certbot \
#     -d maiallm.com -d www.maiallm.com -d api.maiallm.com -d pvt.maiallm.com
#
# Reload with `sudo nginx -t && sudo systemctl reload nginx`.
#
# `listen 443 ssl http2` works on every nginx; on 1.25.1+ you can use
# `listen 443 ssl; http2 on;` instead if the deprecation warning bothers you.
#
# Copy the two files from infra/nginx/ to the host:
#   maiallm.conf     → /etc/nginx/conf.d/maiallm.conf
#   maia-proxy.conf  → /etc/nginx/snippets/maia-proxy.conf
#   infra/landing/   → /var/www/maiallm/

upstream maia_portal {
    server 127.0.0.1:8787;
    keepalive 16;
}

# Enrollment is the only unauthenticated write; keep a brake on it.
limit_req_zone $binary_remote_addr zone=maia_enroll:10m rate=20r/m;

# Shared proxy settings; `map` avoids repeating the header block three times.

# ---------------------------------------------------------------------------
# HTTP: ACME challenges and redirects. Nothing else is served on port 80.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name maiallm.com www.maiallm.com api.maiallm.com pvt.maiallm.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# Landing page
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name maiallm.com www.maiallm.com;

    ssl_certificate /etc/letsencrypt/live/maiallm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/maiallm.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:maia_tls:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    root /var/www/maiallm;
    index index.html;

    # Deploy: rsync -a infra/landing/ /var/www/maiallm/
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /logo.png {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location ~* \.(?:css|js|svg|png|webp|ico)$ {
        expires 7d;
    }
}

# ---------------------------------------------------------------------------
# Public API used by the desktop app
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.maiallm.com;

    ssl_certificate /etc/letsencrypt/live/maiallm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/maiallm.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:maia_tls:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 2m;

    # The backoffice API lives on pvt.maiallm.com only.
    location ^~ /v1/admin/ {
        return 404;
    }

    location = /v1/admin {
        return 404;
    }

    location = /health {
        proxy_pass http://maia_portal;
        include /etc/nginx/snippets/maia-proxy.conf;
    }

    location ^~ /v1/installations {
        limit_req zone=maia_enroll burst=10 nodelay;
        proxy_pass http://maia_portal;
        include /etc/nginx/snippets/maia-proxy.conf;
    }

    location ^~ /v1/ {
        proxy_pass http://maia_portal;
        include /etc/nginx/snippets/maia-proxy.conf;
    }

    location / {
        return 404;
    }
}

# ---------------------------------------------------------------------------
# Private backoffice
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pvt.maiallm.com;

    ssl_certificate /etc/letsencrypt/live/maiallm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/maiallm.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:maia_tls:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    # Optional: keep the backoffice off the public internet entirely.
    # allow 203.0.113.0/24;
    # allow 10.0.0.0/8;
    # deny all;

    client_max_body_size 2m;

    # The SPA is built with base "/admin/", so both the shell and its assets
    # stay under that prefix.
    location = / {
        return 302 /admin;
    }

    location ^~ /admin {
        proxy_pass http://maia_portal;
        include /etc/nginx/snippets/maia-proxy.conf;
    }

    # Session cookie, catalogue refresh, installations, use cases.
    location ^~ /v1/admin/ {
        proxy_pass http://maia_portal;
        include /etc/nginx/snippets/maia-proxy.conf;
    }

    location / {
        return 404;
    }
}
