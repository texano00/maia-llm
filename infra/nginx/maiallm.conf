# maiallm.com on your own nginx.
#
#   /etc/nginx/conf.d/maiallm.conf
#
# The container is the only upstream: it serves the API (`/v1/...`), the
# backoffice bundle (`/admin`) and `/health` on 127.0.0.1:8787. nginx decides
# what each hostname is allowed to reach, so the API and the private backoffice
# never share a hostname.
#
#   maiallm.com      → static landing page  (/var/www/maiallm)
#   api.maiallm.com  → /v1/... and /health, /v1/admin/* answers 404
#   pvt.maiallm.com  → /admin (backoffice SPA) and /v1/admin/*
#
# TLS is terminated by Cloudflare, not here: this file only listens on port 80
# and is reached through a Cloudflare Tunnel. cloudflared keeps the original
# Host header, so the three server blocks below still split by hostname.
#
#   cloudflared tunnel ingress (in ~/.cloudflared/config.yml)
#     - hostname: maiallm.com        → http://localhost:80
#     - hostname: api.maiallm.com    → http://localhost:80
#     - hostname: pvt.maiallm.com    → http://localhost:80
#
# No certbot, no ACME challenge and no redirect to HTTPS: the browser already
# speaks HTTPS to Cloudflare, and a redirect here would fight the tunnel.
# HSTS belongs on the Cloudflare zone (SSL/TLS → Edge Certificates).
#
# Reload with `sudo nginx -t && sudo systemctl reload nginx`.
#
# Copy the two files from infra/nginx/ to the host:
#   maiallm.conf     → /etc/nginx/conf.d/maiallm.conf
#   maia-proxy.conf  → /etc/nginx/snippets/maia-proxy.conf
#   infra/landing/   → /var/www/maiallm/

# No `keepalive` pool on purpose. The upstream is a single local container, and
# recreating it (`docker compose up -d`, Watchtower, a new `latest` tag) replaces
# the host-side proxy that owns 127.0.0.1:8787. nginx would then keep reusing
# sockets to the previous container and answer 502 until someone reloaded it —
# which a routine container refresh must never require. A plain connection per
# request costs microseconds on loopback.
upstream maia-portal {
    server 127.0.0.1:8787;
}

# Enrollment is the only unauthenticated write; keep a brake on it.
limit_req_zone $binary_remote_addr zone=maia_enroll:10m rate=20r/m;

# Behind the tunnel the socket peer is cloudflared, so the client address and
# the original scheme come in headers. Both maps fall back to the socket values
# when a request arrives directly (curl on the host, for example).
map $http_cf_connecting_ip $maia_client_ip {
    default $remote_addr;
    "~."    $http_cf_connecting_ip;
}

map $http_x_forwarded_proto $maia_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# ---------------------------------------------------------------------------
# Landing page
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name maiallm.com www.maiallm.com;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    root /var/www/maiallm;
    index index.html;

    # Deploy: rsync -a infra/landing/ /var/www/maiallm/
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /logo.png {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # The installer resolver is imported by index.html under a fixed name, so a
    # cached copy would keep linking at a stale release after a deploy.
    location = /release.js {
        add_header Cache-Control "no-cache";
        types { }
        default_type text/javascript;
    }

    location ~* \.(?:css|svg|png|webp|ico)$ {
        expires 7d;
    }
}

# ---------------------------------------------------------------------------
# Public API used by the desktop app
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.maiallm.com;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 2m;

    # The backoffice API lives on pvt.maiallm.com only.
    location ^~ /v1/admin/ {
        return 404;
    }

    location = /v1/admin {
        return 404;
    }

    location = /health {
        proxy_pass http://maia-portal;
        include /etc/nginx/snippets/maia-proxy.conf;
    }

    location ^~ /v1/installations {
        limit_req zone=maia_enroll burst=10 nodelay;
        proxy_pass http://maia-portal;
        include /etc/nginx/snippets/maia-proxy.conf;
    }

    location ^~ /v1/ {
        proxy_pass http://maia-portal;
        include /etc/nginx/snippets/maia-proxy.conf;
    }

    location / {
        return 404;
    }
}

# ---------------------------------------------------------------------------
# The product: web.maiallm.com
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name web.maiallm.com;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    # Conversations and attached images travel through /rpc.
    client_max_body_size 24m;

    location / {
        proxy_pass http://127.0.0.1:5173;
        include /etc/nginx/snippets/maia-proxy.conf;
    }

    # Hashed bundles never change under their name; the shell must not be cached
    # or a deployment would keep serving the previous UI.
    location ~* \/assets\/ {
        proxy_pass http://127.0.0.1:5173;
        include /etc/nginx/snippets/maia-proxy.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        proxy_pass http://127.0.0.1:5173;
        include /etc/nginx/snippets/maia-proxy.conf;
        add_header Cache-Control "no-cache";
    }
}

# ---------------------------------------------------------------------------
# Private backoffice
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name pvt.maiallm.com;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    # A relative Location keeps the browser on the scheme it arrived with:
    # nginx would otherwise answer `Location: http://pvt.../admin` and downgrade
    # an HTTPS visit to plain HTTP, where the Secure session cookie is dropped.
    absolute_redirect off;

    # The backoffice should not be reachable from the public internet. With a
    # Cloudflare Tunnel, add a Cloudflare Access policy instead of an IP allow
    # list here: the socket peer is cloudflared, so IPs are not meaningful.
    # allow 203.0.113.0/24;
    # allow 10.0.0.0/8;
    # deny all;

    client_max_body_size 2m;

    # The SPA is built with base "/admin/", so both the shell and its assets
    # stay under that prefix.
    location = / {
        return 302 /admin;
    }

    location ^~ /admin {
        proxy_pass http://maia-portal;
        include /etc/nginx/snippets/maia-proxy.conf;
    }

    # Session cookie, catalogue refresh, installations, use cases.
    location ^~ /v1/admin/ {
        proxy_pass http://maia-portal;
        include /etc/nginx/snippets/maia-proxy.conf;
    }

    location / {
        return 404;
    }
}
