# Shared proxy settings for the portal upstream.
# Included from every proxying location in maiallm.conf.

proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;

# cloudflared terminates TLS and forwards over HTTP, so the client address and
# the original scheme arrive in headers. `maia_client_ip`/`maia_proto` are the
# maps in maiallm.conf; they fall back to socket values for direct calls.
proxy_set_header X-Real-IP $maia_client_ip;
proxy_set_header X-Forwarded-For $maia_client_ip;
proxy_set_header X-Forwarded-Proto $maia_proto;
proxy_set_header X-Forwarded-Host $host;

# The API answers in milliseconds; a stuck backend should fail loudly instead of
# holding a worker.
proxy_connect_timeout 5s;
proxy_send_timeout 30s;
proxy_read_timeout 60s;

# Backend errors are the backend's to describe: pass 502/503 through as-is.
proxy_intercept_errors off;
