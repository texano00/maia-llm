# Production stack for maiallm.com.
#
# `web` serves web.maiallm.com (the product) and `portal` serves the API and
# backoffice. Both track `latest`: CI publishes it on every merge to main and
# Watchtower recreates each container when it moves.
#
#   cp infra/.env.production.example infra/.env   # then edit secrets
#   docker compose -f infra/docker-compose.prod.yml pull
#   docker compose -f infra/docker-compose.prod.yml up -d
#
# Compose loads infra/.env for ${VARS} substitution and hands the same file to
# the container through env_file.
#
# Everything is pull-only: CI builds the image, this host runs it. `latest` moves
# on every green build, and Watchtower re-checks the registry every N seconds, so
# a release lands here without anyone logging in. See docs/portal-deploy.md.
#
# The network is external so it survives `up`/`down` and can be shared with
# anything else on the host. Create it once:
#
#   docker network create net_project_maiallm

name: maiallm

services:
  # The product itself: renderer + /rpc + /events. Public at web.maiallm.com.
  web:
    image: ${MAIA_WEB_IMAGE:-ghcr.io/texano00/maia-llm-web}:${MAIA_IMAGE_TAG:-latest}
    container_name: maia-web
    restart: unless-stopped
    # Watchtower moves this container when `latest` moves.
    pull_policy: always
    env_file:
      - ./.env
    environment:
      NODE_ENV: production
      MAIA_WEB_HOST: 0.0.0.0
      MAIA_WEB_PORT: "5173"
      MAIA_WEB_DATA: /data
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - webdata:/data
    stop_grace_period: 20s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    networks:
      - net_project_maiallm

  portal:
    image: ${MAIA_IMAGE:-ghcr.io/texano00/maia-llm}:${MAIA_IMAGE_TAG:-latest}
    container_name: maia-portal
    restart: unless-stopped
    # `docker compose up -d` should also pick up a moved `latest` tag.
    pull_policy: always
    env_file:
      - ./.env
    environment:
      NODE_ENV: production
      MAIA_DATABASE_FILE: /data/maia.sqlite
      TELEMETRY_HOST: 0.0.0.0
      TELEMETRY_PORT: "8787"
    # Only the reverse proxy on this host may reach the API.
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - portaldata:/data
    # SQLite is a file: give Fastify the time to close it on SIGTERM.
    stop_grace_period: 20s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    networks:
      - net_project_maiallm

  # Checks ghcr.io for a new `latest` every WATCHTOWER_POLL_INTERVAL seconds
  # (300 = 5 minutes) and recreates the labelled containers in place.
  # Maintained fork: the original containrrr image is archived and refuses to
  # talk to Docker >= 25 ("client version 1.25 is too old").
  watchtower:
    image: nickfedor/watchtower:1.24.0
    restart: unless-stopped
    environment:
      WATCHTOWER_POLL_INTERVAL: ${WATCHTOWER_POLL_INTERVAL:-300}
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      TZ: ${TZ:-UTC}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - net_project_maiallm

networks:
  # Shared with the rest of the host: `docker network create net_project_maiallm`
  # once, before the first `up -d`.
  net_project_maiallm:
    external: true

volumes:
  webdata:
  portaldata:
