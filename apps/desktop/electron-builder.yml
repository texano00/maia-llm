appId: com.texano00.maiallm
productName: Maia LLM
copyright: Copyright © 2026 texano00

directories:
  output: release
  buildResources: resources

files:
  - out/**/*

asar: true

win:
  icon: icon.png
  # Code signing is supplied by CSC_LINK and CSC_KEY_PASSWORD in the protected
  # release environment and is required there: Smart App Control blocks an
  # unsigned upgrade outright. Both the installed executables and the installer
  # are signed; the workflow verifies each one before publishing.
  signAndEditExecutable: true
  signingHashAlgorithms:
    - sha256
  target:
    - target: nsis
      arch:
        - x64

nsis:
  artifactName: MaiaLLM-Setup-${version}-${arch}.${ext}
  include: resources/installer.nsh
  oneClick: false
  perMachine: false
  packElevateHelper: false
  # Upgrades reuse the detected install folder, so the assisted installer only
  # needs a single confirmation step. See resources/installer.nsh.
  allowToChangeInstallationDirectory: false
  differentialPackage: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Maia LLM
  runAfterFinish: true
  deleteAppDataOnUninstall: false

msi:
  artifactName: MaiaLLM-${version}-${arch}.${ext}

# macOS is published unsigned by decision: notarization needs a paid Apple
# Developer account. The dmg is therefore shipped with published checksums and a
# documented first-launch confirmation instead (docs/release-process.md).
mac:
  icon: icon.png
  category: public.app-category.developer-tools
  identity: null
  hardenedRuntime: false
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  artifactName: MaiaLLM-${version}-${arch}.${ext}

linux:
  icon: icon.png
  category: Development
  maintainer: texano00
  synopsis: Run open-weight models on a GPU you rent by the minute
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
  artifactName: MaiaLLM-${version}-${arch}.${ext}

publish:
  provider: github
  owner: texano00
  repo: maia-llm
  releaseType: draft
