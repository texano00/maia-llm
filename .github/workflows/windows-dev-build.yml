name: windows-dev-build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version label for this development build"
        required: false
        default: "0.1.0-dev"
      channel:
        description: "Release channel used when publishing"
        type: choice
        options:
          - stable
          - beta
        default: stable
      publish_release:
        description: "Publish a GitHub release so installed clients can update"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run -w @maia/desktop dist:win
      - run: npm run verify:preload
      - name: Generate checksums
        shell: pwsh
        run: |
          Get-ChildItem apps/desktop/release -Filter *.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content apps/desktop/release/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: maia-llm-windows-${{ github.run_number }}
          path: |
            apps/desktop/release/MaiaLLM-Setup-*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest.yml
            apps/desktop/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Publish GitHub release
        if: ${{ inputs.publish_release }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          $version = (Get-Content apps/desktop/package.json | ConvertFrom-Json).version
          $tag = "v$version"
          $assets = @(
            "apps/desktop/release/MaiaLLM-Setup-$version-x64.exe",
            "apps/desktop/release/MaiaLLM-Setup-$version-x64.exe.blockmap",
            "apps/desktop/release/latest.yml",
            "apps/desktop/release/SHA256SUMS.txt"
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path $asset)) { throw "Missing release asset: $asset" }
          }

          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            $flags = @("--title", "Maia LLM $version", "--notes", "Automated build $env:GITHUB_RUN_NUMBER.")
            if ($env:CHANNEL -eq "beta") { $flags += "--prerelease" } else { $flags += "--latest" }
            gh release create $tag --target $env:GITHUB_SHA @flags
          }

          gh release upload $tag $assets --clobber
