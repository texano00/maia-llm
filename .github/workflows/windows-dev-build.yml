name: windows-dev-build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version label for this development build"
        required: false
        default: "0.1.0-dev"
      channel:
        description: "Release channel used when publishing"
        type: choice
        options:
          - stable
          - beta
        default: stable
      publish_release:
        description: "Publish a GitHub release so installed clients can update"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Require code-signing certificate
        shell: pwsh
        env:
          CSC_LINK_BASE64: ${{ secrets.CSC_LINK_BASE64 }}
        run: |
          # Smart App Control blocks unsigned installers outright, so an
          # unsigned build must never reach a release.
          if ([string]::IsNullOrWhiteSpace($env:CSC_LINK_BASE64)) {
            throw "Signing secret is required: set CSC_LINK_BASE64 (and CSC_KEY_PASSWORD) on this repository. An unsigned Windows build is blocked by Smart App Control on upgrade."
          }

          $path = Join-Path $env:RUNNER_TEMP "maia-signing.pfx"
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:CSC_LINK_BASE64))
          "CSC_LINK=$path" >> $env:GITHUB_ENV
      - run: npm run -w @maia/desktop dist:win
        env:
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      - run: npm run verify:preload
      - name: Verify Authenticode signature
        shell: pwsh
        run: |
          # Both the installer and the installed application must carry a valid
          # signature: Smart App Control inspects the executable that runs.
          $targets = @(
            (Get-ChildItem apps/desktop/release -Filter 'MaiaLLM-Setup-*.exe' | Select-Object -First 1),
            (Get-ChildItem apps/desktop/release/win-unpacked -Filter '*.exe' | Select-Object -First 1)
          )

          $signer = $null
          foreach ($target in $targets) {
            if (-not $target) { throw "Signed binary not found" }

            $signature = Get-AuthenticodeSignature $target.FullName
            Write-Host "$($target.Name): $($signature.Status) ($($signature.SignerCertificate.Subject))"
            if ($signature.Status -ne 'Valid') {
              throw "$($target.Name) is not validly signed: $($signature.Status)"
            }

            if (-not $signer) { $signer = $signature.SignerCertificate.Subject }
          }

          "MAIA_SIGNER=$signer" >> $env:GITHUB_ENV
      - name: Generate checksums
        shell: pwsh
        run: |
          # The governance rules ask for SHA-256 and SHA-512 on every artifact.
          Get-ChildItem apps/desktop/release -Filter *.exe | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content apps/desktop/release/SHA256SUMS.txt
          Get-ChildItem apps/desktop/release -Filter *.exe | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA512).Hash.ToLower())  $($_.Name)"
          } | Set-Content apps/desktop/release/SHA512SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: maia-llm-windows-${{ github.run_number }}
          path: |
            apps/desktop/release/MaiaLLM-Setup-*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest.yml
            apps/desktop/release/SHA256SUMS.txt
            apps/desktop/release/SHA512SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Publish GitHub release
        if: ${{ inputs.publish_release }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          $version = (Get-Content apps/desktop/package.json | ConvertFrom-Json).version
          $tag = "v$version"
          $assets = @(
            "apps/desktop/release/MaiaLLM-Setup-$version-x64.exe",
            "apps/desktop/release/MaiaLLM-Setup-$version-x64.exe.blockmap",
            "apps/desktop/release/latest.yml",
            "apps/desktop/release/SHA256SUMS.txt",
            "apps/desktop/release/SHA512SUMS.txt"
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path $asset)) { throw "Missing release asset: $asset" }
          }

          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            $flags = @(
              "--title", "Maia LLM $version",
              "--notes", "Automated build $env:GITHUB_RUN_NUMBER.`n`nSigned by: $env:MAIA_SIGNER"
            )
            if ($env:CHANNEL -eq "beta") { $flags += "--prerelease" } else { $flags += "--latest" }

            $created = $false
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              gh release create $tag --target $env:GITHUB_SHA @flags
              if ($LASTEXITCODE -eq 0) { $created = $true; break }
              Write-Host "gh release create failed (attempt $attempt); retrying in 10s"
              Start-Sleep -Seconds 10
            }
            if (-not $created) { throw "Could not create the release $tag" }
          }

          gh release upload $tag $assets --clobber
