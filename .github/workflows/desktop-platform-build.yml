name: desktop-platform-build

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Attach the artifacts to the existing release for this version"
        type: boolean
        default: false

permissions:
  contents: write

env:
  # Matches the landing page: it only needs a file whose name carries the
  # platform and architecture, so this is shared by every runner.
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            platform: mac
            script: dist:mac
            assets: "*.dmg"
          - runner: ubuntu-latest
            platform: linux
            script: dist:linux
            assets: "*.AppImage *.deb"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build ${{ matrix.platform }} artifacts
        run: npm run -w @maia/desktop ${{ matrix.script }}
      - name: Verify the build runs
        run: npm run verify:preload
      - name: Generate checksums
        shell: bash
        run: |
          cd apps/desktop/release
          shopt -s nullglob
          files=()
          for pattern in ${{ matrix.assets }}; do
            files+=($pattern)
          done
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No ${{ matrix.assets }} produced"
            exit 1
          fi
          shasum -a 256 "${files[@]}" | sed 's/^\([a-f0-9]*\) \*\{0,1\}/\1  /' > "SHA256SUMS-${{ matrix.platform }}.txt"
          cat "SHA256SUMS-${{ matrix.platform }}.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: maia-llm-${{ matrix.platform }}-${{ github.run_number }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/SHA256SUMS-${{ matrix.platform }}.txt
          if-no-files-found: error
          retention-days: 14
      - name: Attach to the release
        if: ${{ inputs.publish_release }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          tag="v$version"

          # The Windows job creates the release; this only adds assets to it.
          if ! gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release $tag does not exist. Run windows-dev-build with publish_release first."
            exit 1
          fi

          # Uploaded one file at a time: a matrix leg only has its own platform's
          # artifacts, and a glob that matched nothing would fail the whole call.
          shopt -s nullglob
          uploaded=0
          for file in apps/desktop/release/*.dmg apps/desktop/release/*.AppImage apps/desktop/release/*.deb; do
            gh release upload "$tag" "$file" --clobber
            uploaded=$((uploaded + 1))
          done
          gh release upload "$tag" "apps/desktop/release/SHA256SUMS-${{ matrix.platform }}.txt" --clobber

          if [ "$uploaded" -eq 0 ]; then
            echo "::error::Nothing to upload for ${{ matrix.platform }}"
            exit 1
          fi
          echo "Attached $uploaded artifacts to $tag"
