name: images

# Builds the two deployable images on every merge to main and publishes `latest`
# beside an immutable tag. The server pulls `latest` (Watchtower polls it), so a
# version bump on main is a deployment.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # The images are the deployment: a merge that reuses a published version
  # deploys nothing, so the bump is a gate, not a warning. This job runs before
  # anything is built and fails the whole workflow when the version in
  # package.json has already been published (or the three manifests disagree).
  version-guard:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Read and match the version
        id: version
        run: |
          root=$(node -p "require('./package.json').version")
          web=$(node -p "require('./apps/web/package.json').version")
          portal=$(node -p "require('./apps/portal/package.json').version")
          if [ "$root" != "$web" ] || [ "$root" != "$portal" ]; then
            echo "::error::Version mismatch: package.json=$root, apps/web=$web, apps/portal=$portal. Set all three to the same version (npm run version:bump -- <x.y.z>)."
            exit 1
          fi
          echo "version=$root" >> "$GITHUB_OUTPUT"
          echo "Version under test: **$root**" >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse an already-published version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          stale=0
          for image in maia-llm-web maia-llm; do
            tag="ghcr.io/$owner/$image:$VERSION"
            if docker manifest inspect "$tag" >/dev/null 2>&1; then
              echo "::error::$tag already exists. Bump the version before pushing: npm run version:bump -- patch (or an explicit version), commit, and push again."
              stale=1
            fi
          done
          if [ "$stale" -ne 0 ]; then
            echo "::error::This push would not publish a new version. Nothing was built."
            exit 1
          fi

  publish:
    needs: version-guard
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            image: maia-llm-web
            dockerfile: apps/web/Dockerfile
          - name: portal
            image: maia-llm
            dockerfile: apps/portal/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Version and tags
        id: meta
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "short=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` only from main: a tag build must never move it backwards.
      #
      # The version tag is immutable and is the tag the release notes link to.
      # Reaching this step with an existing tag means the guard passed but
      # another run published the same version first; that race is fatal rather
      # than a silent sha-only publish.
      - name: Tags
        id: tags
        run: |
          image="ghcr.io/${{ steps.meta.outputs.owner }}/${{ matrix.image }}"
          version_tag="$image:${{ steps.meta.outputs.version }}"
          refs="$image:sha-${{ steps.meta.outputs.short }}"
          if docker manifest inspect "$version_tag" >/dev/null 2>&1; then
            echo "::error::$version_tag was published by another run. Bump the version in package.json and push again."
            exit 1
          fi
          refs="$version_tag,$refs"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            refs="$refs,$image:latest"
          fi
          echo "images=$refs" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.images }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Summary
        run: |
          echo "### ${{ matrix.name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Pushed: ${{ steps.tags.outputs.images }}" >> "$GITHUB_STEP_SUMMARY"
