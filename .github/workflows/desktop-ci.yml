name: desktop-ci

# CI runs once, after a merge lands on main. Feature-branch pushes stay free: a
# PR costs a windows-2022 run per push and nothing consumes the result.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:contract
      - run: npm test
      - run: npm run -w @maia/desktop build
      - run: npm run verify:preload
